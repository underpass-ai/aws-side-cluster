# Grafana dedicado del experimento (ns underpass-labs), aprovisionado por
# codigo: datasources apuntando al stack de monitoring (Prometheus/Loki/Tempo)
# y el dashboard del articulo pre-cargado. Sin persistencia (todo es
# provisioning: recrearlo = identico). Acceso: anonimo como Viewer (capturas
# sin banners de login); admin solo para editar.
#
#   kubectl apply -f experiment/grafana/
#   http://<clusterip>:3000/d/disposable-compute
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-labs-datasources
  namespace: underpass-labs
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus (monitoring)
        uid: prom-mon
        type: prometheus
        access: proxy
        url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        isDefault: true
      - name: Loki (monitoring)
        uid: loki-mon
        type: loki
        access: proxy
        url: http://loki.monitoring.svc:3100
      - name: Tempo (monitoring)
        uid: tempo-mon
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc:3200
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-labs-dashboard-provider
  namespace: underpass-labs
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: experiment
        folder: ""
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-labs
  namespace: underpass-labs
  labels:
    app.kubernetes.io/name: grafana-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-labs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-labs
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /etc/grafana-admin/password
            - name: GF_USERS_DEFAULT_THEME
              value: dark
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: admin
              mountPath: /etc/grafana-admin
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: datasources
          configMap: { name: grafana-labs-datasources }
        - name: dashboard-provider
          configMap: { name: grafana-labs-dashboard-provider }
        - name: dashboards
          configMap: { name: grafana-labs-dashboards }
        - name: admin
          secret: { secretName: grafana-labs-admin }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-labs
  namespace: underpass-labs
spec:
  selector:
    app.kubernetes.io/name: grafana-labs
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# Metricas del propio choreographer (choreo_*) al Prometheus del stack:
# el unico ServiceMonitor que nos faltaba en labs.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: choreographer
  namespace: underpass-labs
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: choreographer
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
