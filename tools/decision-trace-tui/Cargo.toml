[package]
name = "decision-trace-tui"
version = "0.1.0"
edition = "2021"
description = "Reconstructs an AI-agent decision (trace + logs + artifact) after the GPU worker that produced it has been shut down"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
