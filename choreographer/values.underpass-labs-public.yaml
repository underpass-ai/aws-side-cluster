# Overlay para instalar el Choreographer PÚBLICO (github.com/underpass-ai/underpass-choreographer,
# chart OCI ghcr.io/underpass-ai/charts/choreographer) en el ns de los modelos (underpass-labs).
# Se aplica ENCIMA de charts/choreographer/values.embedded-nats.yaml del repo upstream:
#
#   helm -n underpass-labs upgrade --install choreographer \
#     oci://ghcr.io/underpass-ai/charts/choreographer --version 0.1.0 \
#     -f <checkout>/charts/choreographer/values.embedded-nats.yaml \
#     -f choreographer/values.underpass-labs-public.yaml \
#     --set image.digest=sha256:<digest-de-main> \
#     --wait --timeout 10m --atomic
#
# La imagen es privada en GHCR: requiere el secret 'ghcr-pull' en el ns (dockerconfigjson).

imagePullSecrets:
  - name: ghcr-pull

# Proveedor por defecto de los agentes kind=vllm: el llm-gateway (reverse proxy
# OpenAI-compatible, charts/llm-gateway) que descubre los vLLM por label
# underpass.ai/llm-role. Los agentes eligen modelo con provider.model:
# nombre exacto o alias "role:<rol>" (coding/reasoning/general).
providerEnv:
  - name: CHOREO_VLLM_ENDPOINT
    value: http://llm-gateway:8000
  - name: CHOREO_VLLM_MODEL
    value: role:general
  - name: CHOREO_VLLM_MAX_TOKENS
    value: "1024"
  - name: CHOREO_VLLM_TIMEOUT_SECS
    value: "180"
  # Export de trazas (feature otel de la imagen, dormante sin esto): cada
  # deliberacion/ceremonia sale como traza distribuida al Tempo del stack
  # kube-prometheus (ns monitoring), OTLP gRPC plano (sin mTLS en el POC).
  - name: CHOREO_OTLP_ENDPOINT
    value: http://tempo.monitoring.svc:4317
