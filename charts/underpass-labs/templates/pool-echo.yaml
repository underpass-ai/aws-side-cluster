{{- if .Values.poolEcho.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.poolEcho.name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.poolEcho.name | quote }}
    underpass.ai/phase: {{ .Values.phase | quote }}
spec:
  replicas: {{ .Values.poolEcho.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.poolEcho.name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.poolEcho.name | quote }}
        underpass.ai/phase: {{ .Values.phase | quote }}
    spec:
      nodeSelector:
        underpass.ai/node-pool: {{ .Values.nodePool | quote }}
      containers:
        - name: echo
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          args:
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hostname
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /hostname
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.poolEcho.name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.poolEcho.name | quote }}
    underpass.ai/phase: {{ .Values.phase | quote }}
spec:
  type: LoadBalancer
  loadBalancerIP: {{ .Values.poolEcho.loadBalancerIP | quote }}
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: {{ .Values.poolEcho.name | quote }}
  ports:
    - name: http
      port: {{ .Values.poolEcho.service.port }}
      targetPort: {{ .Values.poolEcho.service.targetPort | quote }}
{{- end }}
