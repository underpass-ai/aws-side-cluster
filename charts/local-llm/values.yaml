# Sirve N modelos vLLM en las 4 GPUs locales (RTX 3090, nodo control-plane),
# 1 GPU por modelo. Pensado para el ns del POC (underpass-labs).
# Cada pod pide nvidia.com/gpu: 1; el device-plugin reparte una GPU distinta.

namespace:
  create: false          # underpass-labs ya existe (lo crea charts/underpass-labs)
  name: underpass-labs

image:
  # Nombre TOTALMENTE CUALIFICADO: el nodo es CRI-O con short-name enforcing.
  repository: docker.io/vllm/vllm-openai
  # vLLM >= v0.20.0 usa CUDA 13.0 por defecto (host: driver 595 / CUDA 13.2).
  # 'latest' = CUDA 13 + soporte de modelos 2026. Pinear (p.ej. v0.23.0) para reproducibilidad.
  tag: "latest"
  pullPolicy: IfNotPresent

# Seleccion estilo MIG: en vez de elegir un perfil MIG, se elige el TIPO de GPU
# por las labels nativas de NVIDIA (gpu-feature-discovery, ya las pone el GPU
# Operator). El device-plugin asigna 1 GPU libre de ese tipo a cada pod
# (resources.limits nvidia.com/gpu: 1). Sin etiquetar nada a mano, sin MIG.
# Otras labels GFD utiles: nvidia.com/gpu.memory, nvidia.com/gpu.family,
# nvidia.com/gpu.count, nvidia.com/gpu.compute.major. Override por modelo con
# 'nodeSelector:' dentro de cada model (p.ej. otro nvidia.com/gpu.product).
nodeSelector:
  nvidia.com/gpu.product: NVIDIA-GeForce-RTX-3090
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# Cache HF compartida (evita re-descargar ~60GB). hostPath en el nodo.
modelCache:
  hostPath: /opt/llm-models     # vacío "" => emptyDir efímero
shmSize: "8Gi"

# Token HF (gated). Secret 'huggingface-token' key 'HF_TOKEN' (copiado de
# underpass-runtime). optional=true: si falta, los repos no-gated bajan igual.
hfTokenSecret:
  name: huggingface-token
  key: HF_TOKEN

# Ingress DEDICADO de los modelos (recurso propio del chart, su propio host;
# NO se mezcla con el ingress del POC aws-demand). Ruta por modelo:
#   http://<host>/<model.name>/v1/chat/completions
# El host debe resolver a 192.168.1.241 (ingress-nginx/MetalLB) por DNS interno
# o /etc/hosts. NO añadir a la zona publica de underpassai.com.
ingress:
  enabled: true
  className: nginx
  host: local-llm.underpassai.com
  annotations: {}
  tls:
    enabled: false
    secretName: local-llm-tls

# Defaults por modelo (override con los mismos campos dentro de cada model).
defaults:
  gpuMemoryUtilization: 0.92
  maxModelLen: 32768
  quantization: ""              # "" => vLLM autodetecta del repo (AWQ/compressed-tensors)
  extraArgs: []                 # vacio por defecto; el tool-calling se activa por modelo
  resources:
    limits:
      nvidia.com/gpu: "1"        # 1 GPU por modelo
    requests:
      cpu: "2"
      memory: 8Gi
  service:
    type: ClusterIP              # o LoadBalancer + loadBalancerIP (MetalLB .246-.249)
    port: 8000

# Lineup agéntico: 1 Qwen + 3 vendors distintos (junio 2026). Cambiar a gusto.
models:
  - name: qwen3-coder
    repo: QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ
    servedName: qwen3-coder-30b
    # 65536 no cabe en KV con 24GB (máx ~45840); 40K + util 0.95 deja margen.
    maxModelLen: 40960
    gpuMemoryUtilization: 0.95
    extraArgs: [--enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
    # service: { type: LoadBalancer, loadBalancerIP: 192.168.1.246 }

  # GLM-4.7-Flash AWQ descartado: usa MLA y vLLM 0.23 peta en _compute_prefill_context
  # (kv_b_proj cuantizado sin .weight) con prompts largos/tools. Reemplazado por ERNIE
  # (Baidu, MoE A3B + GQA no-MLA, KV holgada — análogo al qwen3-coder que funciona).
  - name: ernie45-thinking
    repo: cyankiwi/ERNIE-4.5-21B-A3B-Thinking-AWQ-4bit
    servedName: ernie-4.5-21b-a3b
    maxModelLen: 32768
    gpuMemoryUtilization: 0.92
    # El repo AWQ no trae tokenization_ernie4_5.py (código custom del tokenizer);
    # cargamos el tokenizer del repo base oficial (pesos siguen del AWQ).
    extraArgs: [--trust-remote-code, --tokenizer, baidu/ERNIE-4.5-21B-A3B-Thinking, --enable-auto-tool-choice, --tool-call-parser, ernie45, --reasoning-parser, ernie45]

  - name: devstral
    repo: cyankiwi/Devstral-Small-2-24B-Instruct-2512-AWQ-4bit
    servedName: devstral-small-24b
    # Devstral-2-2512 trae torre de visión; para código lo servimos text-only
    # (--limit-mm-per-prompt image=0 evita el profiling Pixtral que crashea al arrancar).
    extraArgs: [--enable-auto-tool-choice, --tool-call-parser, mistral, --limit-mm-per-prompt, '{"image":0}']

  - name: gemma4
    repo: cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
    servedName: gemma-4-26b
    extraArgs: []   # gemma no tiene tool-parser dedicado en vLLM aun; servir plano
