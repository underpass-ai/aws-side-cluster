apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway-code
  namespace: {{ .Values.namespace.name }}
data:
  gateway.py: |
{{ .Files.Get "gateway.py" | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway
  namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-gateway-services-read
  namespace: {{ .Values.namespace.name }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-gateway-services-read
  namespace: {{ .Values.namespace.name }}
subjects:
  - kind: ServiceAccount
    name: llm-gateway
    namespace: {{ .Values.namespace.name }}
roleRef:
  kind: Role
  name: llm-gateway-services-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: aws-side-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
      annotations:
        # rollout automático cuando cambia el código del ConfigMap
        checksum/code: {{ .Files.Get "gateway.py" | sha256sum }}
    spec:
      serviceAccountName: llm-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python3", "-u", "/app/gateway.py"]
          env:
            - name: GATEWAY_LABEL
              value: {{ .Values.discovery.label | quote }}
            - name: GATEWAY_PORT
              value: {{ .Values.service.port | quote }}
            - name: GATEWAY_REFRESH_SECS
              value: {{ .Values.discovery.refreshSeconds | quote }}
            - name: GATEWAY_PROBE_TIMEOUT_SECS
              value: {{ .Values.discovery.probeTimeoutSeconds | quote }}
            - name: GATEWAY_BACKEND_TIMEOUT_SECS
              value: {{ .Values.backendTimeoutSeconds | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: code
          configMap:
            name: llm-gateway-code
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: llm-gateway
    app.kubernetes.io/part-of: aws-side-cluster
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
